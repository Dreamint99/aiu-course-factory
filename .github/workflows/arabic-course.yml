# AI University course factory — makes the Gulf Arabic course (board design, ~30 lessons) unattended, even when the owner's PC is off.
# Every hour (and on demand) it picks up to `max` unfinished lessons: AI spec → checks → voices → free chunked render on the
# public render repo → MP4 uploaded to the release "arabic-course" of the PRIVATE repo Dreamint99/aiu-course-videos;
# specs and progress are committed back here (this repo is public so Actions minutes are free; secrets stay hidden).
# Secrets: OPENROUTER_API_KEY, ELEVENLABS_API_KEY, ANTHROPIC_API_KEY (optional), RENDER_TOKEN (GitHub token with repo+workflow).
name: arabic-course
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      max: { description: "lessons this run", default: "4" }
      only: { description: "comma list of lesson numbers (optional)", default: "" }

concurrency: { group: arabic-course, cancel-in-progress: false }  # separate from japanese-course
permissions: { contents: write }

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.RENDER_TOKEN }}" }
      - id: left
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          p = "src/arabic/factory.json"; total = len(json.load(open("src/arabic/course/design.json"))["lesson_sequence"])
          s = json.load(open(p)) if os.path.exists(p) else {"done": [], "failed": {}}
          left = [n for n in range(1, total + 1) if n not in s["done"] and s["failed"].get(str(n), 0) < 3]
          print(f"count={len(left)}")
          EOF
      - if: steps.left.outputs.count != '0'
        uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - if: steps.left.outputs.count != '0'
        name: tools
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q -r requirements.txt
          git clone -q "https://x-access-token:${{ secrets.RENDER_TOKEN }}@github.com/Dreamint99/aiu-render.git" "$RUNNER_TEMP/aiu-render"
      - if: steps.left.outputs.count != '0'
        name: make lessons
        env:
          CI: "true"
          OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
          ELEVENLABS_API_KEY: "${{ secrets.ELEVENLABS_API_KEY }}"
          ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
          GH_TOKEN: "${{ secrets.RENDER_TOKEN }}"
          RENDER_REPO: "${{ runner.temp }}/aiu-render"
          CLAUDE_LEDGER: "src/arabic/claude_spend.json"
          FACTORY_REPO: "Dreamint99/aiu-course-videos"  # videos stay private even though this repo is public
        run: python scripts/arabic_factory.py --max "${{ inputs.max || '4' }}" --only "${{ inputs.only }}" --upload
